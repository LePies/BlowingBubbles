[project]
name = "blowing-bubbles"
version = "0.2.0"
description = "Equivalent-circuit fitting of electrochemical impedance spectra (EIS)."
readme = "README.md"
authors = [
    { name = "Oliver Mohr", email = "oliver@mohr.dk" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.4",
    "numpy>=1.20",
    "pandas>=1.3",
    "scipy>=1.7",
    "streamlit>=1.66.1",
    "tool>=0.8.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deptry>=0.20",
    "pytest>=9.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.14",
    "ty>=0.0.38",
]
ui = [
    "streamlit>=1.40",
]
desktop = [
    "streamlit>=1.40",
    "pywebview>=5.0",
    "pyinstaller>=6.0",
]
docs = [
    "furo>=2024.1",
    "sphinx>=7,<9",
    "sphinx-gallery>=0.16",
    "sphinxcontrib-bibtex>=2.7.0",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.coverage.run]
source = ["blowing_bubbles"]
omit = ["src/blowing_bubbles/ui/*", "src/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.deptry]
known_first_party = ["blowing_bubbles"]
extend_exclude = ["docs/"]
package_module_name_map = { "pywebview" = "webview" }
ignore = { "DEP002" = ["tool"], "DEP004" = ["pytest"] }
