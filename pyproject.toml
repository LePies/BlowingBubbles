[project]
name = "blowing-bubbles"
version = "0.2.0"
description = "Equivalent-circuit fitting of electrochemical impedance spectra (EIS)."
readme = "README.md"
authors = [
    { name = "Oliver Mohr", email = "oliver@mohr.dk" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.4",
    "numpy>=1.20",
    "pandas>=1.3",
    "scipy>=1.7",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.15.14",
    "ty>=0.0.38",
]
docs = [
    "furo>=2024.1",
    "sphinx>=7,<9",
    "sphinx-gallery>=0.16",
    "sphinxcontrib-bibtex>=2.7.0",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["src", "examples"]
exclude = ["docs/**"]
