[project]
name = "blowing-bubbles"
version = "0.2.1"
description = "Equivalent-circuit fitting of electrochemical impedance spectra (EIS)."
readme = "README.md"
authors = [
    { name = "Oliver Mohr", email = "oliver@mohr.dk" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = [
    "electrochemistry",
    "impedance spectroscopy",
    "EIS",
    "equivalent circuit",
    "CPE",
    "fitting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "matplotlib>=3.4",
    "numpy>=1.20",
    "pandas>=1.3",
    "scipy>=1.7",
    "streamlit>=1.66.1",
    "tool>=0.8.0",
]

[project.urls]
Repository = "https://github.com/LePies/BlowingBubbles"
Issues = "https://github.com/LePies/BlowingBubbles/issues"
Changelog = "https://github.com/LePies/BlowingBubbles/blob/main/CHANGELOG.md"
Documentation = "https://github.com/LePies/BlowingBubbles/tree/main/docs"

[build-system]
requires = ["uv_build>=0.11.16,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deptry>=0.20",
    "pytest>=9.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.14",
    "ty>=0.0.38",
]
ui = [
    "streamlit>=1.40",
]
desktop = [
    "streamlit>=1.40",
    "pywebview>=5.0",
    "pyinstaller>=6.0",
]
docs = [
    "furo>=2025.12.19",
    "myst-nb>=1.4.0",
    "myst-parser>=5.1.0",
    "sphinx>=9.0.4",
    "sphinx-autoapi>=3.8.1",
    "sphinx-gallery>=0.16",
    "sphinxcontrib-bibtex>=2.7.0",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.coverage.run]
source = ["blowing_bubbles"]
omit = ["src/blowing_bubbles/ui/*", "src/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.deptry]
known_first_party = ["blowing_bubbles"]
extend_exclude = ["docs/"]
package_module_name_map = { "pywebview" = "webview" }
ignore = { "DEP002" = ["tool"], "DEP004" = ["pytest"] }
