name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - "docs/**"
      - "examples/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install docs dependencies
        run: uv sync --frozen --no-default-groups --group docs

      - name: Build docs
        run: uv run sphinx-build -W -b html docs/source docs/build/html
