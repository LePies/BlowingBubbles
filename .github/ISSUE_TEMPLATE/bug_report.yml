name: Bug report

description: Report something that is not working as expected
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the fields below.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal code or data that reproduces the issue.
      placeholder: |
        ```python
        import blowing_bubbles
        ...
        ```
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `uv run python -c "import blowing_bubbles; print(blowing_bubbles.__version__)"` or the git commit.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version (`uv run python --version`).
